<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Press Me Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Base styles carried over from the artifact host wrapper */
  :root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  img{max-width:100%}
  [hidden]:not([hidden=until-found i]){display:none!important}
</style>
<style>
  /* Layout: one centered panel; the button is the only thing that asks for action */
  :root {
    --bg: #ececec;
    --panel: #f8f8f8;
    --line: #c4c4c4;
    --ink: #1c1c1c;
    --muted: #6e6e6e;
    --btn: #9a9a9a;
    --btn-hover: #a8a8a8;
    --btn-down: #4a4a4a;
    --btn-edge: #5c5c5c;
    --btn-edge-down: #2c2c2c;
    --btn-text: #ffffff;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161616; --panel: #202020; --line: #3c3c3c; --ink: #ececec; --muted: #9a9a9a;
      --btn: #8a8a8a; --btn-hover: #989898; --btn-down: #3e3e3e; --btn-edge: #4e4e4e; --btn-edge-down: #1a1a1a;
      --btn-text: #ffffff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161616; --panel: #202020; --line: #3c3c3c; --ink: #ececec; --muted: #9a9a9a;
    --btn: #8a8a8a; --btn-hover: #989898; --btn-down: #3e3e3e; --btn-edge: #4e4e4e; --btn-edge-down: #1a1a1a;
    --btn-text: #ffffff; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--mono);
    display: grid; place-items: center;
    padding-inline: 16px; padding-block: 24px;
  }

  .panel {
    width: 100%; max-width: 360px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    padding-block: 28px; padding-inline: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }

  /* Status light: hollow = waiting, filled = done */
  .light {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--muted); background: transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .done .light { background: var(--ink); border-color: var(--ink); }

  /* Housing: a recessed square well tells you the button sinks into it */
  .housing {
    width: 232px; height: 232px; max-width: 100%;
    border-radius: 24px; background: var(--bg);
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.18);
    display: grid; place-items: center;
  }

  #press {
    width: 176px; height: 176px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--btn); color: var(--btn-text);
    font: 600 1.05rem/1.2 var(--mono); letter-spacing: 0.12em;
    box-shadow: 0 12px 0 var(--btn-edge), 0 16px 22px rgba(0,0,0,0.25);
    transform: translateY(-6px);
    transition: transform 0.09s ease-out, box-shadow 0.09s ease-out, background 0.15s;
    display: grid; place-items: center;
  }
  #press:hover:not(:disabled) { background: var(--btn-hover); }
  #press:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--btn-edge), 0 3px 6px rgba(0,0,0,0.25);
  }
  #press:focus-visible { outline: 3px dashed var(--ink); outline-offset: 10px; }

  /* Activated: stays down, darker, no lift */
  #press.on {
    transform: translateY(6px);
    background: var(--btn-down);
    box-shadow: 0 0 0 var(--btn-edge-down), inset 0 4px 10px rgba(0,0,0,0.45);
    cursor: default;
  }
  #press .check { display: none; width: 64px; height: 64px; }
  #press .check path { fill: none; stroke: var(--btn-text); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 80; stroke-dashoffset: 80; }
  #press.on .label { display: none; }
  #press.on .check { display: block; }
  #press.on .check path { animation: draw 0.3s 0.08s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .message {
    margin: 0; min-height: 1.4em;
    font-size: 0.95rem; font-weight: 600; letter-spacing: 0.14em; text-align: center;
    color: var(--muted);
  }
  .done .message { color: var(--ink); }

  #reset {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; color: var(--ink);
    border: 2px solid var(--line); border-radius: 8px;
    padding-block: 8px; padding-inline: 14px;
    font: 500 0.8rem var(--mono); letter-spacing: 0.1em; cursor: pointer;
  }
  #reset:hover:not(:disabled) { border-color: var(--ink); }
  #reset:disabled { opacity: 0.35; cursor: not-allowed; }
  #reset:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  #reset svg { width: 14px; height: 14px; }
  #reset path { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  @media (prefers-reduced-motion: reduce) {
    #press, .light { transition: none; }
    #press.on .check path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<main class="panel" id="panel">
  <span class="light" aria-hidden="true"></span>

  <div class="housing">
    <button id="press" aria-pressed="false">
      <span class="label">PRESS ME</span>
      <svg class="check" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 34 L27 47 L51 19"/></svg>
    </button>
  </div>

  <p class="message" id="message" aria-live="polite">READY</p>

  <button id="reset" disabled>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2v3h3"/></svg>
    RESET
  </button>
</main>

<script>
  const press = document.getElementById('press');
  const reset = document.getElementById('reset');
  const panel = document.getElementById('panel');
  const message = document.getElementById('message');

  press.addEventListener('click', () => {
    if (press.classList.contains('on')) return;
    press.classList.add('on');
    press.setAttribute('aria-pressed', 'true');
    press.setAttribute('aria-label', 'Button activated');
    panel.classList.add('done');
    message.textContent = 'BUTTON ACTIVATED';
    reset.disabled = false;
  });

  reset.addEventListener('click', () => {
    press.classList.remove('on');
    press.setAttribute('aria-pressed', 'false');
    press.removeAttribute('aria-label');
    panel.classList.remove('done');
    message.textContent = 'READY';
    reset.disabled = true;
    press.focus();
  });
</script>

</body>
</html>
